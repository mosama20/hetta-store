<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="craftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#craftGrad)" stroke="#27272a" stroke-width="8"/>
  
  <!-- Subtle Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Center Luxury Monogram / Diamond Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Diamond Frame -->
    <path d="M 0 -130 L 130 0 L 0 130 L -130 0 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Inner Accent Diamond -->
    <path d="M 0 -95 L 95 0 L 0 95 L -95 0 Z" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8" stroke-linejoin="round"/>

    <!-- Letter C / Fashion Stylized Silhouette -->
    <text x="0" y="38" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', 'Plus Jakarta Sans', sans-serif" 
          font-size="128" 
          font-weight="900" 
          fill="url(#goldGrad)" 
          text-anchor="middle"
          letter-spacing="-2">C</text>
  </g>

  <!-- Bottom Mini Sparkle Star -->
  <polygon points="256,420 262,434 276,434 265,442 269,456 256,447 243,456 247,442 236,434 250,434" fill="url(#goldGrad)" opacity="0.9"/>
</svg>
